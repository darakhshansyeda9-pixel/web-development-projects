<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Readify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon-v2.png">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <img src="images/Readify.png" class="nav-logo" alt="Logo"> READIFY 📚
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="cart.html" class="active">Cart</a></li>
            <li><a href="login.html" class="logout-link">Logout</a></li>
        </ul>
    </nav>

    <div class="container" style="padding: 40px 5%;">
        <h1 style="margin-bottom: 30px; color: #2c3e50;">Shopping Cart</h1>
        
        <div style="display: flex; gap: 30px; flex-wrap: wrap;">
            <div style="flex: 2; min-width: 320px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="text-align: left; border-bottom: 2px solid #f8f9fa;">
                                <th style="padding: 15px 10px;">Product</th>
                                <th style="padding: 15px 10px;">Price</th>
                                <th style="padding: 15px 10px;">Quantity</th>
                                <th style="padding: 15px 10px;">Subtotal</th>
                                <th style="padding: 15px 10px;">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style="border-bottom: 1px solid #eee;">
                                <td style="padding: 20px 10px;">
                                    <div style="display: flex; align-items: center; gap: 15px;">
                                        <img src="https://studentstore.pk/cdn/shop/files/B_273_4.jpg" alt="The Silent Patient" style="width: 60px; height: 80px; object-fit: cover; border-radius: 4px;">
                                        <div>
                                            <p style="font-weight: bold; margin: 0; color: #2c3e50;">The Silent Patient</p>
                                            <small style="color: #7f8c8d;">Hardcover</small>
                                        </div>
                                    </div>
                                </td>
                                <td style="padding: 20px 10px;">RS. 299</td>
                                <td style="padding: 20px 10px;">
                                    <input type="number" value="1" min="1" style="width: 50px; padding: 8px; border: 1px solid #ddd; border-radius: 6px;">
                                </td>
                                <td style="padding: 20px 10px; font-weight: bold;">RS. 299</td>
                                <td style="padding: 20px 10px;">
                                    <button style="background: #ff4757; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px;">Remove</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div style="margin-top: 20px;">
                    <a href="products.html" style="text-decoration: none; color: #3498db; font-weight: bold;">← Continue Shopping</a>
                </div>
            </div>

            <div style="flex: 1; min-width: 280px; background: #f9f9f9; padding: 30px; border-radius: 12px; height: fit-content; border: 1px solid #eee;">
                <h3 style="margin-bottom: 20px; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px;">Order Summary</h3>
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <span style="color: #7f8c8d;">Subtotal</span>
                    <span style="font-weight: bold;">RS. 299</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <span style="color: #7f8c8d;">Shipping</span>
                    <span style="color: #2ecc71; font-weight: bold;">FREE</span>
                </div>
                <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
                <div style="display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: bold; color: #2c3e50; margin-bottom: 25px;">
                    <span>Total</span>
                    <span style="color: #3498db;">RS. 299</span>
                </div>
                <a href="checkout.html" style="text-decoration: none;">
                    <button style="width: 100%; background: #3498db; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s;">
                        Proceed to Checkout
                    </button>
                </a>
            </div>
        </div>
    </div>

    <footer style="text-align: center; padding: 30px; color: #7f8c8d; border-top: 1px solid #eee; margin-top: 50px;">
        <p>&copy; 2026 Readify Book Store – Professional UI Design</p>
    </footer>

</body>
</html>
