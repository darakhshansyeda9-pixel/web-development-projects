<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Readify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon-v2.png">
</head>
<body>

    <nav>
        <div class="logo">
            <img src="images/Readify.png" class="nav-logo" alt="Logo">
            READIFY 📚
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <div class="contact-container">
        <div class="contact-header">
            <h1>Get In Touch</h1>
            <p>Have a question? We'd love to hear from you.</p>
        </div>

        <div class="contact-wrapper">
            <div class="contact-info">
                <div class="info-item">
                    <h3>📍 Address</h3>
                    <p>123 Book Street, Karachi, Pakistan</p>
                </div>
                <div class="info-item">
                    <h3>📧 Email</h3>
                    <p>support@readify.com</p>
                </div>
                <div class="info-item">
                    <h3>📞 Phone</h3>
                    <p>+92 301 2896650</p>
                </div>
            </div>

            <div class="contact-form">
                <form action="#">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea rows="5" placeholder="How can we help you?" required></textarea>
                    </div>
                    <button type="submit" class="btn-send">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Readify Book Store</p>
    </footer>

</body>
</html>
