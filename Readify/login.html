<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration | Readify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon-v2.png">
</head>
<body class="login-page">

    <nav>
        <div class="logo">
            <img src="images/Readify.png" class="nav-logo" alt="Logo">
            READIFY 📚
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="index.html" class="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <div class="login-container" style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; padding: 50px 20px;">
        
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Please enter your details to login</p>
            <form>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">Login to Readify</button>
            </form>
            <div class="login-footer">
                <a href="#">Forgot Password?</a>
                <span>New here? <a href="#register">Create Account</a></span>
            </div>
        </div>

        <div class="login-card" id="register">
            <h2>Create Account</h2>
            <p>Join Readify to start your reading journey</p>
            <form>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label>Create Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">Register Now</button>
            </form>
            <div class="login-footer">
                <span>Already have an account? <a href="#">Login here</a></span>
            </div>
        </div>

    </div>

</body>
</html>
