<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Readify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon-v2.png">
</head>
<body class="login-page">
    <nav>
        <a href="index.html" class="logo">
            <img src="images/Readify.png" class="nav-logo" alt="Logo"> READIFY 📚
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <div class="login-container">
        <div class="login-box" style="max-width: 500px; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
            <h2 style="color: #2c3e50; margin-bottom: 8px; font-size: 2rem;">Create Account</h2>
            <p style="color: #7f8c8d; margin-bottom: 30px;">Join Readify to start your reading journey</p>
            
            <form action="login.html">
                <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                    <label style="font-weight: 600; color: #34495e;">Full Name</label>
                    <input type="text" placeholder="John Doe" required style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 6px; outline: none; transition: 0.3s;">
                </div>

                <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                    <label style="font-weight: 600; color: #34495e;">Email Address</label>
                    <input type="email" placeholder="email@example.com" required style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 6px; outline: none;">
                </div>

                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div class="form-group" style="text-align: left; flex: 1;">
                        <label style="font-weight: 600; color: #34495e;">Password</label>
                        <input type="password" placeholder="........" required style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 6px;">
                    </div>
                    <div class="form-group" style="text-align: left; flex: 1;">
                        <label style="font-weight: 600; color: #34495e;">Confirm</label>
                        <input type="password" placeholder="........" required style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 6px;">
                    </div>
                </div>

                <div style="text-align: left; margin-bottom: 20px; font-size: 13px; color: #7f8c8d; display: flex; align-items: flex-start; gap: 8px;">
                    <input type="checkbox" required style="margin-top: 3px;">
                    <span>I agree to the <a href="#" style="color: #3498db; text-decoration: none;">Terms of Service</a> and <a href="#" style="color: #3498db; text-decoration: none;">Privacy Policy</a>.</span>
                </div>
                
            <a href="login.html" style="text-decoration: none; display: block; width: 100%;">
    <button type="button" class="btn-login" style="width: 100%; margin-top: 25px; border: none; cursor: pointer;">
        Register Now
    </button>
</a>
            </form>

            <p style="margin-top: 25px; font-size: 14px; text-align: center; color: #7f8c8d; border-top: 1px solid #eee; padding-top: 20px;">
                Already have an account? 
                <a href="login.html" style="color: #3498db; text-decoration: none; font-weight: bold; transition: 0.3s;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
                    Login here
                </a>
            </p>
        </div>
    </div>
</body>
</html>
