<!DOCTYPE html>
<html>
<head>
    <title>Skills Selection</title>
</head>

<body>

    <h2>Skills Selection</h2>

    <form>
        <label>Skills:</label><br>

        <input type="checkbox" id="html" name="skills" value="HTML" checked>
        <label for="html">HTML</label><br>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label><br>

        <input type="checkbox" id="javascript" name="skills" value="JavaScript" checked>
        <label for="javascript">JavaScript</label><br>

        <input type="checkbox" id="database" name="skills" value="Database">
        <label for="database">Database</label>

    </form>

</body>
</html>
